[workspace]

[package]
name = "pipeline-demo"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
web = ["dep:tungstenite"]

[dependencies]
auralis-signal = { path = "../../crates/auralis-signal", features = ["diagnostics"] }
auralis-task = { path = "../../crates/auralis-task", features = ["debug"] }
auralis-devtools = { path = "../../crates/auralis-devtools" }
serde_json = "1"
tungstenite = { version = "0.28", optional = true }
