<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auralis DevTools — Pipeline Monitor</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,monospace;background:#0d1117;color:#c9d1d9;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{background:#161b22;padding:10px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #30363d;flex-shrink:0}
header h1{font-size:16px;color:#58a6ff}
header .stat{font-size:12px;color:#8b949e}
header .stat b{color:#c9d1d9}
#panels{display:flex;flex:1;overflow:hidden}
.panel{flex:1;overflow-y:auto;padding:12px;border-right:1px solid #30363d;min-width:0}
.panel:last-child{border-right:none}
.panel h2{font-size:13px;color:#58a6ff;margin-bottom:8px;position:sticky;top:0;background:#0d1117;padding:4px 0;z-index:1}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:3px 6px;text-align:left;border-bottom:1px solid #21262d;white-space:nowrap}
th{color:#8b949e;font-weight:normal;position:sticky;top:28px;background:#0d1117}
td.addr{color:#484f58;font-size:10px}
tr:hover{background:#161b22}
#graph-panel{position:relative;overflow:hidden}
#dep-graph{width:100%;height:100%}
.graph-sig{fill:#58a6ff;stroke:#0d1117;stroke-width:1.5}
.graph-memo{fill:#3fb950;stroke:#0d1117;stroke-width:1.5}
.graph-edge{stroke:#30363d;stroke-width:1.2;fill:none;stroke-opacity:0.7}
.graph-edge-highlight{stroke:#f0883e;stroke-width:2;stroke-opacity:1}
.graph-label{fill:#c9d1d9;font-size:9px;pointer-events:none;text-anchor:middle}
.graph-label-bg{fill:#0d1117;opacity:0.8}
#tooltip{position:absolute;background:#161b22;border:1px solid #30363d;border-radius:4px;padding:6px 10px;font-size:11px;pointer-events:none;display:none;z-index:10;max-width:240px}
#tooltip .tt-label{color:#58a6ff;font-weight:bold;margin-bottom:2px}
#tooltip .tt-row{color:#8b949e}
#tooltip .tt-row b{color:#c9d1d9}
.legend{position:absolute;bottom:8px;left:8px;display:flex;gap:12px;font-size:10px;color:#8b949e}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:8px;height:8px;border-radius:50%}
.legend .dot-sig{background:#58a6ff}
.legend .dot-memo{background:#3fb950}
.status{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
.status-alive{background:#3fb950}
.status-dead{background:#f85149}
.computed-high{color:#f0883e}
</style>
</head>
<body>
<header>
  <h1>Auralis DevTools</h1>
  <span class="stat" id="sig-count">Signals: <b>0</b></span>
  <span class="stat" id="memo-count">Memos: <b>0</b></span>
  <span class="stat" id="task-count">Tasks: <b>0</b></span>
  <span class="stat">|</span>
  <span class="stat" id="conn-status"><span class="status status-dead"></span>disconnected</span>
</header>
<div id="panels">
  <div class="panel" id="signals-panel">
    <h2>Signals</h2>
    <table>
      <thead><tr><th>Label</th><th>Ver</th><th>Subs</th><th>Addr</th></tr></thead>
      <tbody id="signals-body"></tbody>
    </table>
  </div>
  <div class="panel" id="memos-panel">
    <h2>Memos</h2>
    <table>
      <thead><tr><th>Label</th><th>Ver</th><th>Subs</th><th>Dirty</th><th>Computed</th><th>Deps</th><th>Addr</th></tr></thead>
      <tbody id="memos-body"></tbody>
    </table>
  </div>
  <div class="panel" id="graph-panel">
    <h2>Dependency Graph</h2>
    <svg id="dep-graph"></svg>
    <div id="tooltip"></div>
    <div class="legend">
      <span><span class="dot dot-sig"></span> Signal</span>
      <span><span class="dot dot-memo"></span> Memo</span>
    </div>
  </div>
  <div class="panel" id="tasks-panel">
    <h2>Task Tree</h2>
    <pre id="task-tree" style="font-size:10px;line-height:1.5"></pre>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const WS_URL = 'ws://127.0.0.1:9642';
let addrToLabel = {};
let snapData = null;

function connect() {
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => setStatus(true);
  ws.onclose = () => { setStatus(false); setTimeout(connect, 2000); };
  ws.onmessage = (e) => { render(JSON.parse(e.data)); };
}

function setStatus(ok) {
  const el = document.getElementById('conn-status');
  el.innerHTML = ok
    ? '<span class="status status-alive"></span>connected'
    : '<span class="status status-dead"></span>disconnected';
}

function render(snap) {
  snapData = snap;
  addrToLabel = {};
  for (const s of snap.signals) if (s.label) addrToLabel[s.addr] = s.label;
  for (const m of snap.memos) if (m.label) addrToLabel[m.addr] = m.label;

  renderSignals(snap.signals);
  renderMemos(snap.memos);
  renderGraph(snap.signals, snap.memos);
  renderTasks(snap.task_tree);

  document.getElementById('sig-count').innerHTML = `Signals: <b>${snap.signals.length}</b>`;
  document.getElementById('memo-count').innerHTML = `Memos: <b>${snap.memos.length}</b>`;
}

function renderSignals(signals) {
  document.getElementById('signals-body').innerHTML = signals.map(s => `
    <tr>
      <td>${esc(s.label || '(unnamed)')}</td>
      <td>${s.version}</td>
      <td>${s.subscriber_count}</td>
      <td class="addr">${s.addr}</td>
    </tr>`).join('');
}

function renderMemos(memos) {
  document.getElementById('memos-body').innerHTML = memos.map(m => `
    <tr>
      <td>${esc(m.label || '(unnamed)')}</td>
      <td>${m.version}</td>
      <td>${m.subscriber_count}</td>
      <td>${m.is_dirty ? '⚠' : '✓'}</td>
      <td class="${m.compute_count > 100000 ? 'computed-high' : ''}">${m.compute_count}</td>
      <td>${m.dependency_addrs.map(a => esc(addrToLabel[a] || short(a))).join(', ')}</td>
      <td class="addr">${m.addr}</td>
    </tr>`).join('');
}

// ── D3 Force Graph ────────────────────────────────────────────────

let simActive = false;

function renderGraph(signals, memos) {
  const svg = d3.select('#dep-graph');
  const W = svg.node().clientWidth || 600;
  const H = svg.node().clientHeight || 500;

  // Build graph data
  const nodes = [];
  const edges = [];
  const nodeMap = {};

  for (const s of signals) {
    const label = addrToLabel[s.addr];
    if (!label) continue;
    const n = { id: s.addr, label, type: 'signal', subs: s.subscriber_count, ver: s.version };
    nodes.push(n);
    nodeMap[s.addr] = n;
  }
  for (const m of memos) {
    const label = addrToLabel[m.addr] || m.label || short(m.addr);
    const n = { id: m.addr, label, type: 'memo', subs: m.subscriber_count, ver: m.version,
      dirty: m.is_dirty, computed: m.compute_count, deps: m.dependency_addrs };
    nodes.push(n);
    nodeMap[m.addr] = n;
    for (const dep of m.dependency_addrs) {
      if (nodeMap[dep]) edges.push({ source: dep, target: m.addr });
    }
  }

  svg.selectAll('*').remove();

  // Zoom
  const g = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.2, 4]).on('zoom', (e) => g.attr('transform', e.transform)));

  // Arrow marker
  g.append('defs').append('marker')
    .attr('id', 'arrow').attr('viewBox', '0 -4 8 8')
    .attr('refX', 14).attr('refY', 0).attr('markerWidth', 6).attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path').attr('d', 'M0,-4L8,0L0,4').attr('fill', '#30363d');

  // Edges
  const link = g.append('g').selectAll('line').data(edges).join('line')
    .attr('class', 'graph-edge').attr('marker-end', 'url(#arrow)');

  // Nodes
  const node = g.append('g').selectAll('g').data(nodes).join('g')
    .attr('cursor', 'grab')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

  node.append('circle')
    .attr('r', d => d.type === 'signal' ? 6 : 7)
    .attr('class', d => d.type === 'signal' ? 'graph-sig' : 'graph-memo');

  node.append('text')
    .attr('dy', d => d.type === 'signal' ? -10 : -11)
    .attr('class', 'graph-label')
    .text(d => d.label);

  // Tooltip
  const tip = d3.select('#tooltip');
  node.on('mouseenter', (e, d) => {
    tip.style('display', 'block').html(`
      <div class="tt-label">${esc(d.label)}</div>
      <div class="tt-row">type: <b>${d.type}</b></div>
      <div class="tt-row">ver: <b>${d.ver}</b>  subs: <b>${d.subs}</b></div>
      ${d.type === 'memo' ? `
      <div class="tt-row">dirty: <b>${d.dirty}</b>  computed: <b>${d.computed}x</b></div>
      <div class="tt-row">deps: <b>${d.deps.length}</b></div>` : ''}
    `);
  }).on('mousemove', (e) => {
    const box = svg.node().getBoundingClientRect();
    tip.style('left', (e.clientX - box.left + 12) + 'px')
       .style('top', (e.clientY - box.top - 10) + 'px');
  }).on('mouseleave', () => tip.style('display', 'none'));

  // Click: highlight upstream + downstream
  node.on('click', (e, d) => {
    const upstream = new Set([d.id]);
    const downstream = new Set([d.id]);
    // BFS upstream
    let q = [d.id]; while (q.length) {
      const cur = q.shift();
      for (const ed of edges) {
        if (ed.target === cur && !upstream.has(ed.source)) {
          upstream.add(ed.source); q.push(ed.source);
        }
      }
    }
    // BFS downstream
    q = [d.id]; while (q.length) {
      const cur = q.shift();
      for (const ed of edges) {
        if (ed.source === cur && !downstream.has(ed.target)) {
          downstream.add(ed.target); q.push(ed.target);
        }
      }
    }
    const all = new Set([...upstream, ...downstream]);
    node.select('circle').attr('opacity', n => all.has(n.id) ? 1 : 0.15);
    node.select('text').attr('opacity', n => all.has(n.id) ? 1 : 0.15);
    link.attr('class', ed =>
      all.has(ed.source.id || ed.source) && all.has(ed.target.id || ed.target)
        ? 'graph-edge graph-edge-highlight' : 'graph-edge');
    // Click same node again or click background to reset
    e.stopPropagation();
  });
  svg.on('click', () => {
    node.select('circle').attr('opacity', 1);
    node.select('text').attr('opacity', 1);
    link.attr('class', 'graph-edge');
  });

  // Force simulation
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id(d => d.id).distance(80))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide(20))
    .on('tick', () => {
      link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      node.attr('transform', d => `translate(${d.x},${d.y})`);
    });
  simActive = true;
}

// ── Tasks ──────────────────────────────────────────────────────────

function renderTasks(text) {
  document.getElementById('task-tree').textContent = text;
  const m = text.match(/task \d+/g);
  document.getElementById('task-count').innerHTML = `Tasks: <b>${m ? m.length : 0}</b>`;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function short(addr) { return addr.slice(0, 10) + '…'; }

connect();
</script>
</body>
</html>
