[workspace]

[package]
name = "auralis-wasm-counter"
version = "0.1.0"
edition = "2021"
description = "Minimal Wasm reactive counter — Signal + Memo + timer::sleep in the browser"

[lib]
crate-type = ["cdylib"]

[dependencies]
auralis-signal = { path = "../../crates/auralis-signal" }
auralis-task = { path = "../../crates/auralis-task" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "Window",
] }
