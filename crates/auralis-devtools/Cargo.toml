[package]
name = "auralis-devtools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Diagnostic DevTools for the Auralis reactive kernel — JSON snapshots, real-time change streams, and CLI inspection"
repository.workspace = true

[features]
default = []
ws-transport = ["dep:tungstenite"]
wasm-bridge = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
auralis-signal = { workspace = true, features = ["diagnostics"] }
auralis-task = { workspace = true, features = ["debug"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
