[workspace]
members = [
    "crates/auralis-signal",
    "crates/auralis-task",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/auralis"
rust-version = "1.80"

[workspace.dependencies]
# Internal
auralis-signal = { path = "crates/auralis-signal" }
auralis-task   = { path = "crates/auralis-task" }

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
strip         = true

[profile.dev]
opt-level = 0
